name: Verify Eyebrowse (APK on request)
on:
  push:
    branches: [branding/eyebrowse-namespace-migration, apk-build/debug-4eaaba28]
  workflow_dispatch:
    inputs:
      apk:
        description: APK variant to build (one only)
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: read
concurrency:
  group: eyebrowse-verified-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brand:
    name: Our logo and name are still ours
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Compare the brand assets
        run: |
          set -euo pipefail
          check() {
            file="$1"; want="$2"
            if [ ! -f "$file" ]; then
              echo "::error::$file is missing"
              exit 1
            fi
            got="$(sha256sum "$file" | cut -d' ' -f1)"
            if [ "$got" != "$want" ]; then
              echo "::error::$file changed. If this is deliberate, update the hash in brand-guard.yml. If not, Mozilla's artwork is back."
              exit 1
            fi
            echo "ok $file"
          }
          # the file Mozilla's fox used to live in must stay ours, by content rather than by hash,
          # because it is a tiny xml that points at our launcher mark
          if ! grep -q "@mipmap/ic_launcher" eyebrowse/app/src/main/res/drawable/ic_survey_mark.xml; then
            echo "::error::ic_survey_mark.xml no longer points at our launcher mark"
            exit 1
          fi
          echo "ok ic_survey_mark.xml"
          # Use the supplied transparent infinity mark for splash; preserve private launcher artwork.
          check eyebrowse/app/src/main/res/drawable-nodpi/ic_splash_logo.png 203fbbb21c37de09c62241a0a1ebea7645a3abe20931482369f3ef4eeee3bd91
          check eyebrowse/app/src/main/res/mipmap-xxhdpi/ic_launcher_private.png edec1500795ec6d7e0a5a298d82712134bfa9fcdeee0fc00f48b57c6e476f55f
          check eyebrowse/app/src/main/res/mipmap-xxhdpi/ic_launcher_private_round.png 9abf345a316baabc09292556ab78449f0058b19b3dc0ae6c1e507b32ca5d7189
          check eyebrowse/app/src/main/res/drawable/ic_wordmark_logo.webp 3f62a3a7cbaf46de1af95733e5540c8e515c979bd91118de7cd69dbb9803dd5a
          check eyebrowse/app/src/main/res/drawable/ic_wordmark_text_normal.webp bbb4f2c4c940765f6490d5161d6f044e9a2ed5c8a31ff178282a5b351262d1a0
          check eyebrowse/app/src/main/res/drawable/ic_wordmark_text_private.webp 8ed6b798d586309818c81f04b704f76b7cf45498993129630a9035ea89c42c6b

      - name: No Mozilla artwork by content
        # File names can stay, artwork cannot. This looks for the actual shapes and words rather
        # than trusting a file to be what its name says.
        run: |
          set -euo pipefail
          fail=0

          # 1. the fox vector, by its path data
          if grep -rl "M50.15,18.05" eyebrowse/app/src android-components 2>/dev/null | grep -q .; then
            echo "::error::Mozilla's fox vector is back in the tree"
            grep -rl "M50.15,18.05" eyebrowse/app/src android-components | head -5
            fail=1
          fi

          # 2. every screen that used to draw their artwork must point at our mark
          for f in \
            eyebrowse/app/src/main/res/drawable/ic_survey_mark.xml \
            eyebrowse/app/src/main/res/drawable/ic_pocket.xml \
            eyebrowse/app/src/main/res/drawable/pocket_vector.xml \
            eyebrowse/app/src/main/res/drawable/ic_account.xml \
            eyebrowse/app/src/main/res/drawable/ic_fx_accounts_avatar.xml ; do
            if [ -f "$f" ] && ! grep -q "@mipmap/ic_launcher" "$f"; then
              echo "::error::$f no longer points at our launcher mark"
              fail=1
            fi
          done

          # 3. no user-visible string may say Firefox in the default language
          if grep -n ">Firefox<\|>Firefox \| Firefox<" eyebrowse/app/src/main/res/values/strings.xml 2>/dev/null | grep -v "<!--" | grep -q .; then
            echo "::error::a visible string still says Firefox"
            grep -n ">Firefox<\|>Firefox \| Firefox<" eyebrowse/app/src/main/res/values/strings.xml | grep -v "<!--" | head -5
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "no Mozilla artwork, no Mozilla word on any screen"

      - name: Check localized browser branding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Check translated spellings missed by an English-only brand scan.
          old_brand = re.compile(r"ಫೈರ್[\u200c\u200d]?ಫಾಕ್ಸ್|फ़ायरफ़ॉक्स|फायरफॉक्स|फ़ायरफॉक्स|फायरफ़ॉक्स|ഫയർഫോക്[\u200c\u200d]?സ്|ෆයර්ෆොක්ස්|فایرفاکس|فایەرفۆکس")
          failed = False
          for path in sorted(Path("eyebrowse/app/src/main/res").glob("values*/strings.xml")):
              for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if old_brand.search(line):
                      print(f"::error file={path},line={number}::Legacy localized browser name")
                      failed = True
          raise SystemExit(1 if failed else 0)
          PY

      - name: Reject build variant branding overrides
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("eyebrowse/app/src")
          reserved = {
              "ic_wordmark_logo", "ic_wordmark_text_normal", "ic_wordmark_text_private",
              "ic_logo_wordmark_normal", "ic_logo_wordmark_private", "ic_splash_logo",
              "ic_launcher", "ic_launcher_round", "ic_launcher_foreground",
              "ic_launcher_private", "ic_launcher_private_round", "ic_launcher_private_foreground",
              "ic_launcher_monochrome", "eyebrowse_search_widget",
          }
          bad = []
          for source in root.iterdir():
              if not source.is_dir() or source.name in {"main", "test", "androidTest"}:
                  continue
              for file in (source / "res").rglob("*"):
                  if file.is_file() and file.stem in reserved:
                      bad.append(file)
              for file in (source / "res").glob("values*/*.xml"):
                  if 'name="app_name"' in file.read_text(encoding="utf-8") or 'name="ic_launcher_background"' in file.read_text(encoding="utf-8") or 'name="SplashScreen"' in file.read_text(encoding="utf-8"):
                      bad.append(file)
          for file in bad:
              print(f"::error file={file}::Use shared Eyebrowse branding from src/main/res")
          raise SystemExit(1 if bad else 0)
          PY

      - name: Verify repository product identity
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          # Only first-party product metadata. External project references, dependency
          # IDs, license notices, historical fixtures and upstream URLs are legitimate.
          errors = []
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          if not Path('eyebrowse/settings.gradle').is_file() or Path('fenix').exists():
              errors.append('Expected eyebrowse/ application directory; legacy fenix/ root is not allowed')
          if "rootProject.name = 'Eyebrowse'" not in Path('eyebrowse/settings.gradle').read_text():
              errors.append('Gradle root project name is not Eyebrowse')
          for name in filter(None, tracked):
              if re.search(r"fire(?:fox|box)", name, re.IGNORECASE):
                  print(f"::warning::Review legacy product name in path: {name}")
          for name in ("eyebrowse/gradle.properties", "android-components/gradle.properties"):
              content = Path(name).read_text()
              for key in ("libUrl", "libVcsUrl"):
                  if not re.search(rf"^{key}=https://github\.com/Eyesearch/Eyebrowse(?:[/.]|$)", content, re.M):
                      errors.append(f"{name}: {key} does not point to Eyebrowse")
          for name in ("eyebrowse/app/onboarding.fml.yaml", "eyebrowse/app/nimbus.fml.yaml",
                       "eyebrowse/app/.experimenter.yaml", "eyebrowse/app/messaging-evergreen-messages.fml.yaml"):
              for line in Path(name).read_text().splitlines():
                  if re.search(r"\bfire(?:fox|box)\b", line, re.I):
                      errors.append(f"{name}: legacy product description")
          profiling = Path("eyebrowse/tools/setup-startup-profiling.py").read_text()
          for channel, suffix in (("release", ""), ("beta", ".beta"),
                                  ("nightly", ".nightly"), ("debug", ".debug")):
              if f'"{channel}": "org.eyesearch.eyebrowse{suffix}"' not in profiling:
                  errors.append(f"Incorrect profiling package for {channel}")
          for error in errors:
              print(f"::error::{error}")
          raise SystemExit(1 if errors else 0)
          PY

      - name: Verify migrated source namespace and installed app ID
        run: |
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          root = Path("eyebrowse")
          tracked = subprocess.check_output(["git", "ls-files", "-z", "eyebrowse"]).decode().split("\0")
          old = [p for p in tracked if "/org/mozilla/fenix/" in p]
          assert not old, old[:20]
          for p in root.rglob("*"):
              if p.is_file() and p.suffix in {".kt", ".java"}:
                  assert not re.search(r"^\s*(?:package|import)\s+org\.mozilla\.fenix\b", p.read_text(), re.M), p
          build = (root / "app/build.gradle").read_text()
          assert "namespace 'org.eyesearch.eyebrowse'" in build
          assert 'applicationId "org.eyesearch.eyebrowse"' in build
          assert (root / "app/src/main/java/org/eyesearch/eyebrowse/EyebrowseApplication.kt").is_file()
          print("Namespace, source paths and application ID verified")
          PY

  build-debug-apk:
    needs: brand
    name: Compile and test Eyebrowse
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: eyebrowse
    env:
      # Optional: add the real file from the Firebase console as a repository
      # secret named GOOGLE_SERVICES_JSON. Without it a placeholder is written,
      # which is enough for the debug build to compile and link.
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # The build reads the git hash for versioning, so history is useful.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list asks for the legacy "tools"
          # package, which no longer exists in the SDK repository and makes the
          # setup step fail. Install what we need explicitly below instead.
          packages: 'platform-tools'

      - name: Install the Android SDK packages this project needs
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses > /dev/null

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v4

      - name: Provide google-services.json
        working-directory: .
        run: |
          set -euo pipefail
          target="eyebrowse/app/google-services.json"
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > "$target"
            echo "Wrote google-services.json from the GOOGLE_SERVICES_JSON secret."
          else
            cat > "$target" <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "eyebrowse-ci-placeholder",
              "storage_bucket": "eyebrowse-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "org.eyesearch.eyebrowse"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000001",
                  "android_client_info": {
                    "package_name": "org.eyesearch.eyebrowse.debug"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
            echo "No GOOGLE_SERVICES_JSON secret found; wrote a placeholder file."
          fi

      - name: Provide the Nimbus FML tooling
        working-directory: .
        run: |
          set -euo pipefail
          # The Nimbus Gradle plugin downloads a nimbus-fml binary for the pinned
          # application-services version. That version is a nightly, whose CI
          # artifacts have since expired, so the download fails on a fork.
          # Seed the binary from a published release of the same cycle instead:
          # the plugin skips its own download when the file already exists.
          version="$(sed -n 's/^val VERSION = "\(.*\)"/\1/p' \
            android-components/plugins/dependencies/src/main/java/ApplicationServices.kt)"
          echo "application-services version: $version"
          target="eyebrowse/build/bin/nimbus/$version"
          mkdir -p "$target"
          if [ -x "$target/nimbus-fml" ]; then
            echo "nimbus-fml already present"
            exit 0
          fi

          tmp="$(mktemp -d)"
          found=""
          for candidate in "$version" "125.0"; do
            url="https://archive.mozilla.org/pub/app-services/releases/$candidate/nimbus-fml.zip"
            echo "Trying $url"
            if curl -fsSL --retry 3 -o "$tmp/nimbus-fml.zip" "$url"; then
              found="$candidate"
              break
            fi
          done
          if [ -z "$found" ]; then
            echo "::error::Could not download a nimbus-fml binary"
            exit 1
          fi

          unzip -o -q "$tmp/nimbus-fml.zip" -d "$tmp/extracted"
          echo "Archive contents:"
          find "$tmp/extracted" -type f -exec ls -l {} \; | head -n 40

          # Pick the real ELF executable: the archive may contain wrapper
          # scripts or notes alongside the per-platform binaries.
          elf_files="$(find "$tmp/extracted" -type f -exec sh -c '
            if [ "$(head -c 4 "$1" | od -An -tx1 | tr -d " \n")" = "7f454c46" ]; then
              echo "$1"
            fi' _ {} \; | sort)"
          # The runners are x86_64, so prefer that build: the archive also
          # carries an aarch64 binary, which cannot run here.
          binary="$(printf '%s\n' "$elf_files" | grep 'x86_64-unknown-linux' | head -n 1 || true)"
          if [ -z "$binary" ]; then
            binary="$(printf '%s\n' "$elf_files" | grep 'unknown-linux' | head -n 1 || true)"
          fi
          if [ -z "$binary" ]; then
            binary="$(printf '%s\n' "$elf_files" | head -n 1 || true)"
          fi
          if [ -z "$binary" ]; then
            echo "::error::The nimbus-fml archive has no linux executable"
            exit 1
          fi
          cp "$binary" "$target/nimbus-fml"
          chmod +x "$target/nimbus-fml"
          echo "Seeded nimbus-fml from application-services $found ($binary)"

      - name: Compile and run app unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileEyebrowseDebugKotlin :app:testEyebrowseDebugUnitTest -Pabis=arm64-v8a --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Eyebrowse-unit-test-results
          path: |
            eyebrowse/app/build/test-results/testEyebrowseDebugUnitTest/
            eyebrowse/app/build/reports/tests/testEyebrowseDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Assemble the debug APK
        if: (github.event_name == 'workflow_dispatch' && inputs.apk == 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/apk-build/debug-4eaaba28')
        run: |
          chmod +x ./gradlew
          # Only the arm64-v8a split is built: modern 64-bit devices are the
          # target, and it keeps the artifact around 80 MB instead of 450 MB.
          ./gradlew :app:assembleEyebrowseDebug -Pabis=arm64-v8a --stacktrace

      - name: Verify debug APK package and signature
        if: (github.event_name == 'workflow_dispatch' && inputs.apk == 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/apk-build/debug-4eaaba28')
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/eyebrowse/debug/*arm64*.apk; do
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | grep -E "^package: name='org\.eyesearch\.eyebrowse\.debug'"
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"
            sha256sum "$apk" > "$apk.sha256"
          done

      - name: Upload the debug APK
        if: (github.event_name == 'workflow_dispatch' && inputs.apk == 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/apk-build/debug-4eaaba28')
        uses: actions/upload-artifact@v4
        with:
          name: Eyebrowse-Debug-APK
          path: eyebrowse/app/build/outputs/apk/eyebrowse/debug/*arm64*.apk*
          if-no-files-found: error
          retention-days: 14

  build-release-apk:
    needs: build-debug-apk
    if: github.event_name == 'workflow_dispatch' && inputs.apk == 'release'
    # Eyebrowse: back on, because the debug build has a different package name and installs as a
    # SECOND app, so testing it never replaced the app on the phone. This one keeps the real package
    # and installs over it, signed with the same key.

    name: Assemble Eyebrowse release APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: eyebrowse
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install the Android SDK packages this project needs
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses > /dev/null

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v4

      - name: Provide google-services.json
        working-directory: .
        run: |
          set -euo pipefail
          target="eyebrowse/app/google-services.json"
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > "$target"
            echo "Wrote google-services.json from the GOOGLE_SERVICES_JSON secret."
          else
            cat > "$target" <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "eyebrowse-ci-placeholder",
              "storage_bucket": "eyebrowse-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "org.eyesearch.eyebrowse"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
            echo "No GOOGLE_SERVICES_JSON secret found; wrote a placeholder file."
          fi

      - name: Provide the Nimbus FML tooling
        working-directory: .
        run: |
          set -euo pipefail
          version="$(sed -n 's/^val VERSION = "\(.*\)"/\1/p' \
            android-components/plugins/dependencies/src/main/java/ApplicationServices.kt)"
          target="eyebrowse/build/bin/nimbus/$version"
          mkdir -p "$target"
          if [ -x "$target/nimbus-fml" ]; then
            exit 0
          fi
          tmp="$(mktemp -d)"
          found=""
          for candidate in "$version" "125.0"; do
            url="https://archive.mozilla.org/pub/app-services/releases/$candidate/nimbus-fml.zip"
            if curl -fsSL --retry 3 -o "$tmp/nimbus-fml.zip" "$url"; then
              found="$candidate"
              break
            fi
          done
          if [ -z "$found" ]; then
            echo "::error::Could not download a nimbus-fml binary"
            exit 1
          fi
          unzip -o -q "$tmp/nimbus-fml.zip" -d "$tmp/extracted"
          elf_files="$(find "$tmp/extracted" -type f -exec sh -c '
            if [ "$(head -c 4 "$1" | od -An -tx1 | tr -d " \n")" = "7f454c46" ]; then
              echo "$1"
            fi' _ {} \; | sort)"
          binary="$(printf '%s\n' "$elf_files" | grep 'x86_64-unknown-linux' | head -n 1 || true)"
          if [ -z "$binary" ]; then
            binary="$(printf '%s\n' "$elf_files" | head -n 1 || true)"
          fi
          if [ -z "$binary" ]; then
            echo "::error::The nimbus-fml archive has no linux executable"
            exit 1
          fi
          cp "$binary" "$target/nimbus-fml"
          chmod +x "$target/nimbus-fml"

      - name: Assemble the release APK
        run: |
          chmod +x ./gradlew
          # Eyebrowse: a release build with shrinking on, signed with the debug key
          # so it can be installed straight away. This is the build users get: the
          # debug one carries every language, every symbol and no shrinking.
          ./gradlew :app:assembleEyebrowseRelease \
            -Pabis=arm64-v8a \
            -PlocalProperties.autosignReleaseWithDebugKey=true \
            --stacktrace

      - name: Report the sizes
        run: |
          ls -l app/build/outputs/apk/eyebrowse/release/*arm64*.apk || true

      - name: Verify release APK package and signature
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/eyebrowse/release/*arm64*.apk; do
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | grep -E "^package: name='org\.eyesearch\.eyebrowse'"
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"
            sha256sum "$apk" > "$apk.sha256"
          done

      - name: Upload the release APK
        uses: actions/upload-artifact@v4
        with:
          name: Eyebrowse-Release-APK
          path: eyebrowse/app/build/outputs/apk/eyebrowse/release/*arm64*.apk*
          if-no-files-found: error
          retention-days: 14
