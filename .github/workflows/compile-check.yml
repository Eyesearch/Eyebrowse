name: Compile check

# The fast gate: does the Kotlin compile? That is what almost every failure has been, and it takes
# a couple of minutes instead of the ten a full APK build needs. The APK itself is built only when
# someone dispatches "Build APKs" by hand.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: compile-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: Compile the app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: fenix
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install the Android SDK packages this project needs
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses > /dev/null

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v4

      - name: Provide google-services.json
        working-directory: .
        run: |
          set -euo pipefail
          target="fenix/app/google-services.json"
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > "$target"
          else
            printf '%s' '{"project_info":{"project_number":"000000000000","project_id":"eyebrowse-ci-placeholder","storage_bucket":"eyebrowse-ci-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"org.eyesearch.eyebrowse"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > "$target"
          fi

      - name: Provide the Nimbus FML tooling
        working-directory: .
        run: |
          set -euo pipefail
          version="$(sed -n 's/^val VERSION = "\\(.*\\)"/\\1/p' \
            android-components/plugins/dependencies/src/main/java/ApplicationServices.kt)"
          target="fenix/build/bin/nimbus/$version"
          mkdir -p "$target"
          if [ -x "$target/nimbus-fml" ]; then
            exit 0
          fi
          tmp="$(mktemp -d)"
          for candidate in "$version" "125.0"; do
            url="https://archive.mozilla.org/pub/app-services/releases/$candidate/nimbus-fml.zip"
            if curl -fsSL --retry 3 -o "$tmp/nimbus-fml.zip" "$url"; then
              unzip -o -q "$tmp/nimbus-fml.zip" -d "$tmp/extracted"
              binary="$(find "$tmp/extracted" -type f -exec sh -c '
                if [ "$(head -c 4 "$1" | od -An -tx1 | tr -d " \\n")" = "7f454c46" ]; then echo "$1"; fi' _ {} \\; | grep x86_64 | head -n 1 || true)"
              if [ -n "$binary" ]; then
                cp "$binary" "$target/nimbus-fml"
                chmod +x "$target/nimbus-fml"
                exit 0
              fi
            fi
          done
          echo "::error::Could not seed nimbus-fml"
          exit 1

      - name: Compile the debug variant
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileFenixDebugKotlin -Pabis=arm64-v8a --stacktrace
